name: Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 2.1.0). Defaults to pyproject version."
        required: false

# Serialize doc deployments so concurrent releases don't clobber gh-pages.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish versioned docs
    runs-on: ${{ github.repository_owner == 'twilio' && 'ubuntu-x64' || 'ubuntu-latest' }}
    if: github.repository_owner == 'twilio'
    permissions:
      contents: write # mike pushes the built site to the gh-pages branch
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0 # mike needs full history of the gh-pages branch
      - name: Authenticate with Artifactory
        uses: twilio/sdk-actions/artifactory-oidc@26f95a54e57993c1bf3b26bec2905f395814c23a # v1.0.0
        with:
          ecosystem: python
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5
        with:
          version: "0.9.26"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group docs

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing docs for version $VERSION"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy versioned docs
        # --alias-type=copy writes real files for the "latest" alias instead of a
        # symlink; GitHub Pages' legacy branch builder rejects symlinks.
        # VERSION is passed via env: (not interpolated into the script) so a
        # crafted workflow_dispatch input can't inject shell commands.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --group docs mike deploy --push --update-aliases --alias-type=copy \
            "$VERSION" latest
          uv run --group docs mike set-default --push latest
