name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --all-extras --all-groups

      - name: Run ruff check
        run: |
          . .venv/bin/activate
          echo "Checking Python files in repository:"
          find . -name "*.py" -not -path "./.venv/*" -not -path "./.*" -type f | sort | head -30
          echo ""
          echo "Total Python files to check:"
          find . -name "*.py" -not -path "./.venv/*" -not -path "./.*" -type f | wc -l
          echo ""
          uv run ruff check .

      - name: Run ruff format check
        run: |
          . .venv/bin/activate
          echo "Checking formatting for Python files in repository:"
          find . -name "*.py" -not -path "./.venv/*" -not -path "./.*" -type f | wc -l
          echo "files"
          echo ""
          uv run ruff format --check .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --all-extras --all-groups

      - name: Run mypy
        run: |
          . .venv/bin/activate
          echo "Type checking directories: src/tac getting_started"
          echo ""
          echo "Python files in src/tac:"
          find src/tac -name "*.py" -type f | wc -l
          echo ""
          echo "Python files in getting_started:"
          find getting_started -name "*.py" -type f | wc -l
          echo ""
          MYPYPATH=src uv run mypy src/tac getting_started

  test:
    name: Test - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --all-extras --all-groups

      - name: Run tests
        run: |
          . .venv/bin/activate
          uv run pytest

  secrets-scan:
    name: Secret Detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0  # Need history for detecting changed files

      - name: Run gitleaks with SHA-pinned image
        run: |
          source .gitleaks/versions.env
          echo "Using gitleaks image: $GITLEAKS_IMAGE"

          # For PRs: scan commits in the PR
          # For pushes to main: scan the single commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SCAN_RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            SCAN_RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi

          docker run --rm -v "$(pwd):/repo" -w /repo "$GITLEAKS_IMAGE" \
            detect --source="." --log-opts="$SCAN_RANGE" --no-git --verbose --redact

  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.26"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build package
        run: |
          uv build

      - name: Check package metadata
        run: |
          uv venv
          . .venv/bin/activate
          pip install twine
          twine check dist/*

      - name: Test package installation
        run: |
          python -m venv test-env
          . test-env/bin/activate
          pip install dist/*.whl
          python -c "import tac; print(f'Successfully imported tac version {tac.__version__}')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  all-checks:
    name: All Checks Passed
    needs: [lint, type-check, test, build, secrets-scan]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all job statuses
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs['type-check'].result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs['secrets-scan'].result }}" != "success" ]; then
            echo "One or more checks failed"
            exit 1
          fi
